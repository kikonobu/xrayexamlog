<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinical exam log</title>
<meta name="examlog-standalone" content="1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exam log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1218" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDEFF3;
    --surface: #FFFFFF;
    --ink: #0F1A24;
    --muted: #586674;
    --line: #D3D9E0;
    --accent: #2340D8;
    --accent-ink: #FFFFFF;
    --focus: #2340D8;
    --ok: #1B7F4B;
    --ok-ink: #FFFFFF;
    --warn: #A95A00;
    --warn-bg: #FFF1DA;
    --danger: #B3261E;
    --bar: #0F1A24;
    --bar-ink: #F2F5F8;
    --bar-muted: #A3B0BC;
    --bar-line: rgba(255, 255, 255, 0.16);
    --go: #3DD68C;
    --go-ink: #06240F;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1218;
      --surface: #151F29;
      --ink: #E9EEF3;
      --muted: #93A3B1;
      --line: #263543;
      --accent: #8FA3FF;
      --accent-ink: #0A1233;
      --focus: #8FA3FF;
      --ok: #4CD08A;
      --ok-ink: #06240F;
      --warn: #F0A44B;
      --warn-bg: #33260F;
      --danger: #F28B82;
      --bar: #1D2B38;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1218;
    --surface: #151F29;
    --ink: #E9EEF3;
    --muted: #93A3B1;
    --line: #263543;
    --accent: #8FA3FF;
    --accent-ink: #0A1233;
    --focus: #8FA3FF;
    --ok: #4CD08A;
    --ok-ink: #06240F;
    --warn: #F0A44B;
    --warn-bg: #33260F;
    --danger: #F28B82;
    --bar: #1D2B38;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 17px/1.4 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
    -webkit-touch-callout: none;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px 40px; }

  /* header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 6px; }
  .top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .today { padding: 4px 12px; border-radius: 999px; border: 0; background: var(--surface); font-size: 15px; font-weight: 700; }
  .tabs { display: flex; gap: 24px; border-bottom: 1.5px solid var(--line); margin-bottom: 14px; }
  .tab { min-height: 48px; padding: 0 2px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1.5px; background: none; color: var(--muted); font-weight: 700; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab small { margin-left: 6px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .banner { margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-weight: 700; }

  /* when strip */
  .when { margin-top: 12px; padding: 12px 14px; background: var(--surface); border-radius: 14px; }
  .whenrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .nudges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .nudge { min-height: 40px; padding: 0 6px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .nudge:active { transform: scale(0.97); }
  .nudge.reset { color: var(--accent); border-color: var(--line); }
  .whentime { display: block; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .whendate { display: block; margin-top: 2px; font-size: 15px; color: var(--muted); }
  .whenside { display: flex; align-items: center; gap: 10px; }
  .livetag { display: inline-flex; align-items: center; font-size: 14px; font-weight: 700; color: var(--muted); }
  .livetag.live::before { content: ""; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--ok); }
  .whenedit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; padding: 12px 14px; background: var(--surface); border-radius: 14px; }
  .whenedit label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .whenedit input { width: 100%; min-height: 48px; padding: 4px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); font-size: 17px; font-weight: 700; }
  .whenedit p { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--muted); }
  .whenedit .btn { grid-column: 1 / -1; }

  /* groups */
  .group { margin: 0; padding: 16px 0 18px; border-top: 1.5px solid var(--line); }
  .when + .group, .whenedit + .group { margin-top: 12px; }
  .group.missing { margin: 12px 0 4px; padding: 14px; border-top-color: transparent; border-radius: 16px; background: var(--warn-bg); outline: 2px solid var(--warn); }
  .group h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 19px; font-weight: 700; }
  .mark { flex: none; width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); font-size: 14px; font-weight: 700; line-height: 1; }
  .mark.done { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
  .mark.flag { border-color: var(--warn); color: var(--warn); }
  .right { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); text-align: right; }
  .right.need { font-weight: 700; color: var(--warn); }
  .note { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  .note.flush { margin: 0; }
  .note.tight { margin: 0 0 4px; }
  .sublabel { margin: 14px 0 8px; font-size: 15px; font-weight: 700; color: var(--muted); }

  /* controls */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
  .grid.w46 { grid-template-columns: repeat(auto-fit, minmax(46px, 1fr)); }
  .grid.w56 { grid-template-columns: repeat(auto-fit, minmax(56px, 1fr)); }
  .grid.w72 { grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); }
  .grid.w100 { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
  .grid.w104 { grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 52px; padding: 6px 8px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink);
    font-weight: 700; line-height: 1.15; text-align: center;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .grid.w104 .chip { min-height: 48px; }
  .regions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .region { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--muted); font-weight: 700; }
  .region[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .added { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .partchip { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px 0 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; }
  .partchip button { width: 40px; height: 40px; border: 0; background: none; color: inherit; font-size: 24px; line-height: 1; }

  .link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; }
  .btn { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
  .btn.small { min-height: 40px; padding: 0 14px; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  /* save bar */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--bar); color: var(--bar-ink); border-radius: 20px 20px 0 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  #bar[hidden] { display: none; }
  .barin { max-width: 560px; margin: 0 auto; }
  .sumrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
  .sum { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .sum.need { color: #FFC27A; }
  .sum.idle { color: var(--bar-muted); font-weight: 400; }
  .clear { flex: none; min-height: 32px; padding: 0 4px; border: 0; background: none; color: var(--bar-muted); font-weight: 700; text-decoration: underline; }
  .btnrow { display: flex; gap: 10px; }
  .btn.ghost { min-height: 56px; background: transparent; border-color: var(--bar-line); color: var(--bar-ink); }
  .primary { flex: 1; min-height: 56px; border: 0; border-radius: 14px; background: var(--go); color: var(--go-ink); font-size: 19px; font-weight: 700; }
  .primary.incomplete { background: rgba(255, 255, 255, 0.14); color: var(--bar-muted); }
  .toast { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; padding: 4px 4px 4px 14px; border-radius: 12px; background: rgba(61, 214, 140, 0.18); color: #A8F0CE; font-weight: 700; }
  .toast button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; }

  /* history */
  .histhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .histhead p { margin: 0; font-weight: 700; color: var(--muted); }
  .dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 20px 0 8px; font-size: 16px; font-weight: 700; }
  .dayhead span:last-child { font-size: 14px; font-weight: 400; color: var(--muted); }
  .dayrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 20px 0 8px; }
  .dayrow .dayhead { display: block; margin: 0; }
  .dayrow .dayhead span:last-child { display: block; }
  .entry { padding: 12px 14px; margin-bottom: 8px; background: var(--surface); border-radius: 14px; }
  .etop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .etop strong { font-size: 20px; font-variant-numeric: tabular-nums; }
  .del { min-height: 40px; padding: 0 10px; border: 0; background: none; color: var(--muted); font-weight: 700; }
  .sheetbox { margin-bottom: 4px; padding: 14px; background: var(--surface); border-radius: 14px; }
  .sheetbox h2 { margin: 0 0 4px; font-size: 19px; }
  .sheetbox .hint { margin: 0; }
  .sheetbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 0; }
  .btn.solid { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .undostrip { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding: 4px 4px 4px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; }
  .undostrip button { min-height: 40px; padding: 0 14px; border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; }
  #modal .backdrop { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: rgba(8, 14, 20, 0.6); }
  #modal .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 20px 20px 0 0; }
  .sheet h2 { margin: 0 0 4px; font-size: 21px; }
  .dlgwhen { margin: 0 0 8px; color: var(--muted); }
  .dlgbtns { display: grid; gap: 12px; margin-top: 16px; }
  .btn.big { min-height: 56px; font-size: 18px; }
  .btn.keep { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .eact { display: flex; align-items: center; gap: 6px; }
  .del.edit { color: var(--accent); }
  .editbanner { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; padding: 10px 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); }
  .editbanner span { font-size: 15px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { padding: 4px 10px; border-radius: 8px; background: var(--bg); font-size: 15px; font-weight: 700; }
  .tag.views { background: var(--ink); color: var(--bg); }
  .empty { padding: 40px 8px; text-align: center; color: var(--muted); }
  .empty h2 { margin: 0 0 6px; font-size: 19px; color: var(--ink); }
  textarea.export { display: block; width: 100%; min-height: 120px; margin: 10px 0; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font: 14px/1.4 ui-monospace, Menlo, monospace; -webkit-user-select: text; user-select: text; }

  /* options */
  .opt { padding: 16px 0 18px; border-top: 1.5px solid var(--line); }
  .opthead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .opthead h2 { margin: 0; font-size: 19px; }
  .switches { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-bottom: 8px; }
  .switch { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 16px; font-weight: 700; }
  .switch input { width: 22px; height: 22px; accent-color: var(--accent); }
  .optchip { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 4px 0 14px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; }
  .optchip button { width: 40px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; }
  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); }
  .hint { margin: 0 0 8px; color: var(--muted); font-size: 15px; }
  .pgap { margin: 10px 0 0; }
  .topr { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
  .today.synok { color: var(--ok); }
  .today.synwait, .today.syn { color: var(--muted); }
  .today.synwarn { background: var(--warn-bg); color: var(--warn); }
  .syncbox { margin-bottom: 10px; }
  .syncline { margin: 6px 0 0; font-weight: 700; }
  .linkin { display: block; width: 100%; min-height: 48px; margin: 10px 0; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); }
  .btn.wide { width: 100%; }
  .recbox { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--bg); }
  .recbox p { margin: 0 0 8px; }
  .recbox p.gap { margin-top: 16px; }
  .recbox .wide { margin-top: 8px; }
  .startcard { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--surface); }
  .startcard + .group { margin-top: 12px; }
  .startlabel { margin: 0; font-size: 14px; font-weight: 700; color: var(--muted); }
  .startsum { margin: 2px 0 10px; font-weight: 700; overflow-wrap: anywhere; }
  .chips.usual .chip { min-height: 46px; padding: 0 14px; }
  /* step-by-step flow */
  .wrap { padding-top: 8px; }
  .top h1 { font-size: 21px; }
  .tabs { margin-bottom: 10px; }
  .tab { min-height: 44px; }
  .strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 0 0 14px; }
  .seg { min-width: 0; min-height: 56px; padding: 6px 8px; display: flex; flex-direction: column; justify-content: center; gap: 1px; text-align: left; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); }
  .segl { font-size: 12px; font-weight: 700; color: var(--muted); }
  .segv { min-height: 18px; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg.done { border-color: var(--ok); }
  .seg.done .segl { color: var(--ok); }
  .seg.done .segl::before { content: "\2713\00a0"; }
  .seg.cur { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .seg.cur .segl { color: var(--bg); opacity: 0.75; }
  .steph { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 0 12px; font-size: 22px; font-weight: 700; }
  .steph-sub { font-size: 14px; font-weight: 400; color: var(--muted); }
  .tiles { display: grid; gap: 10px; }
  .tiles.c1 { grid-template-columns: 1fr; }
  .tiles.c2 { grid-template-columns: 1fr 1fr; }
  .tiles.c3 { grid-template-columns: repeat(3, 1fr); }
  .tile { min-height: 72px; min-width: 0; padding: 8px 10px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: 19px; font-weight: 700; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
  .tile.sm { min-height: 56px; font-size: 17px; border-radius: 14px; }
  .tile.reg { min-height: 56px; font-size: 18px; }
  .tile.big { min-height: 84px; font-size: 26px; }
  .tile[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tile:active, .seg:active { transform: scale(0.98); }
  .moretech { margin-top: 10px; }
  .rv { display: grid; gap: 8px; margin-bottom: 4px; }
  .rvrow { display: grid; grid-template-columns: 88px 1fr auto; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px; text-align: left; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); }
  .rvl { font-size: 14px; font-weight: 700; color: var(--muted); }
  .rvv { font-weight: 700; overflow-wrap: anywhere; }
  .rvgo { font-size: 14px; font-weight: 700; color: var(--accent); }
  .rvrow.todo { border-color: var(--warn); background: var(--warn-bg); }
  .rvrow.todo .rvv { color: var(--warn); }
  .editbanner { flex-direction: row; align-items: center; justify-content: space-between; }
  .editbanner > div { display: flex; flex-direction: column; }
  .bn { min-height: 40px; padding: 0 6px; border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; }
  .btn.ghost:disabled { opacity: 0.35; }
  .primary:disabled { cursor: default; }
  #bar { padding-top: 10px; }
  .recrow { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 6px 0; font-size: 15px; }
  .recrow input { flex: none; width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); }
  .etl { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
  .smark { font-size: 13px; font-weight: 700; color: var(--muted); }
  .smark.ok { color: var(--ok); }
  .smark.warn { color: var(--warn); }
  .note.warnt { color: var(--warn); font-weight: 700; }
  .selectlabel { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: 15px; font-weight: 700; color: var(--muted); }
  .selectlabel select { min-height: 48px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: 17px; font-weight: 700; }
  .preview { margin: 0; padding: 10px; border-radius: 10px; background: var(--bg); font: 14px/1.5 ui-monospace, Menlo, monospace; overflow-x: auto; white-space: pre; }
  .addpartbtn { margin: 10px 0 4px; border-style: dashed; color: var(--accent); border-color: var(--accent); }
  .searchbar { position: relative; margin: 10px 0; }
  .searchbar input { display: block; width: 100%; min-height: 48px; padding: 0 44px 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: 16px; -webkit-appearance: none; }
  .searchbar input::-webkit-search-cancel-button { -webkit-appearance: none; }

<script>
/* Runs only when this page is NOT inside Claude. It lets the same app talk to a small
   script in the person's own Google account (the "bridge") instead. Inside Claude, window.claude
   already exists and this block does nothing. */
(function () {
  if (window.claude) return;
  var KEY = "examlog:bridge";
  var cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { cfg = null; }
  if (cfg && (!cfg.url || !cfg.token)) cfg = null;

  function fail(code, message) { var e = new Error(message || code); e.code = code; return e; }

  function call(tool, input) {
    if (!cfg) return Promise.reject(fail("server_not_connected", "The bridge isn’t set up yet."));
    return fetch(cfg.url, { method: "POST", body: JSON.stringify({ token: cfg.token, tool: tool, input: input || {} }) })
      .then(function (r) { return r.text(); }, function () { throw fail("server_unavailable", "Couldn’t reach the bridge."); })
      .then(function (t) {
        var j;
        try { j = JSON.parse(t); } catch (e) { throw fail("upstream_error", "The bridge sent back something unexpected."); }
        if (j.error) throw fail(j.error.code || "tool_error", j.error.message);
        return j.result;
      });
  }

  var mcp = {
    callTool: function (server, tool, input) {
      return call(tool, input).then(function (p) { return { payload: p, content: [{ type: "text", text: JSON.stringify(p) }] }; });
    }
  };
  function snap(id, data) {
    return { id: id, exists: !!data, data: function () { return data ? JSON.parse(JSON.stringify(data)) : undefined; } };
  }
  var db = {
    collection: function () {
      return {
        get: function () {
          return call("db_all").then(function (r) { return { docs: ((r && r.docs) || []).map(function (d) { return snap(d.id, d.data); }) }; });
        },
        doc: function (id) {
          return { set: function (data) { return call("db_set", { id: id, data: data }).then(function () {}); } };
        },
        onSnapshot: function (next, error) {
          var last = {}, stopped = false, timer = null;
          function schedule() { if (!stopped) timer = setTimeout(poll, 45000); }
          function poll() {
            if (stopped || document.hidden) { schedule(); return; }
            call("db_all").then(function (r) {
              var changes = [];
              ((r && r.docs) || []).forEach(function (d) {
                var str = JSON.stringify(d.data);
                if (last[d.id] !== str) {
                  changes.push({ type: last[d.id] === undefined ? "added" : "modified", doc: snap(d.id, d.data) });
                  last[d.id] = str;
                }
              });
              if (changes.length) next({ docChanges: function () { return changes; } });
            }, function (e) { if (error) error(e); }).then(schedule);
          }
          schedule();
          return function () { stopped = true; clearTimeout(timer); };
        }
      };
    }
  };

  window.claude = {
    __bridge: true,
    __configured: function () { return !!cfg; },
    __configure: function (url, token) {
      cfg = { url: String(url).trim(), token: String(token).trim() };
      try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
    },
    __forget: function () { cfg = null; try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } },
    __ping: function () { return call("ping"); },
    use: function (name) {
      if (!cfg) return Promise.resolve(null);
      if (name === "mcp") return Promise.resolve(mcp);
      if (name === "db") return Promise.resolve(db);
      if (name === "user") return Promise.resolve({ id: function () { return Promise.resolve("me"); } });
      return Promise.resolve(null);
    }
  };
})();

<script>
(function () {
  "use strict";
  var KEY = "examlog:v1";
  var VERSION = 11;
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var asArray = function (v) { return Array.isArray(v) ? v : [v]; };

  var FLUORO = ["MBS", "Esophagram", "UGI", "SBFT", "Barium enema", "ESI", "Joint injection", "Arthrogram", "Myelogram", "Lumbar puncture", "HSG", "VCUG", "Cystogram", "Urethrogram", "Sialogram", "Tube / drain study", "PICC / line"];
  var REGIONS = [
    ["Chest and abdomen", ["Chest", "Ribs", "Sternum", "Abdomen", "Pelvis"]],
    ["Spine", ["C-Spine", "T-Spine", "L-Spine", "Sacrum", "Coccyx", "SI joints", "Scoliosis"]],
    ["Upper extremity", ["Finger", "Thumb", "Hand", "Wrist", "Scaphoid", "Forearm", "Elbow", "Humerus", "Shoulder", "Clavicle", "AC joints", "Scapula"]],
    ["Lower extremity", ["Toe", "Foot", "Calcaneus", "Ankle", "Tib/Fib", "Knee", "Patella", "Femur", "Hip"]],
    ["Head and neck", ["Skull", "Facial bones", "Nasal bones", "Orbits", "Sinuses", "Mandible", "TMJ", "Soft tissue neck"]],
    ["Fluoro", FLUORO]
  ];
  var DEFAULT_PARTS = REGIONS.reduce(function (acc, r) { return acc.concat(r[1]); }, []).concat(["Other"]);
  var OLD_PARTS = ["Chest", "Abdomen", "Upper extremity", "Lower extremity", "Spine", "Skull / face", "Other", "Pelvis / hip", "Shoulder", "Cervical spine", "Thoracic spine", "Lumbar spine", "Sacrum / coccyx", "Tibia / fibula", "Neck (soft tissue)", "Barium swallow"];
  var PART_RENAME = { "Cervical spine": "C-Spine", "Thoracic spine": "T-Spine", "Lumbar spine": "L-Spine", "Sacrum / coccyx": "Sacrum", "Tibia / fibula": "Tib/Fib", "Neck (soft tissue)": "Soft tissue neck", "Barium swallow": "Esophagram" };
  var STEP_SHORT = { part: "Part", setting: "Setting", assist: "Assist", tech: "Tech" };
  var SHORT = { "Chest and abdomen": "Chest & abd", "Upper extremity": "Upper ext", "Lower extremity": "Lower ext", "Head and neck": "Head & neck" };

  var SHEET_TECHS = ["Ben Poniatowski", "Britney Palmer", "Brittney Palmer", "Gabby Herrera", "Jaman Causie", "Jason", "Joesph V", "Lionel Woods", "Micah Leah", "Mona Kea", "Samrith Nith", "Sarah Turner", "Sean King", "Visal Ebbot"];
  function defaultCats() {
    return [
      { id: "setting", label: "Setting", on: true, multi: false, ph: "Add an option", options: ["MOBILE", "FLUORO", "XR", "C-ARM", "DEXA"] },
      { id: "exam", label: "Body part", on: true, multi: false, ph: "Add a body part", options: DEFAULT_PARTS.slice() },
      { id: "views", label: "Number of views", on: true, multi: false, isViews: true, ph: "Add a number", options: ["1", "2", "3", "4", "5", "6+"] },
      { id: "assist", label: "Assistance", on: true, multi: false, ph: "Add an option", options: ["Assisted", "Unassisted", "Observed"] },
      { id: "tech", label: "Tech", on: true, multi: true, ph: "Add a tech’s name", options: SHEET_TECHS.slice() },
      { id: "special", label: "Special population", on: true, multi: false, optional: true, ph: "Add an option", options: ["Pediatric", "Geriatric"] }
    ];
  }

  var state = { v: VERSION, cfg: { cats: defaultCats() }, entries: [], sync: { on: false, id: "", tabId: 0, title: "" }, dq: [], tomb: {}, cfgU: 0 };
  var storageFailed = false;
  var view = "log";
  var sel = {};
  var parts = [], pendP = null, pendV = null, regionSel = null;
  var step = "part", pstage = "region", techAll = false, topNext = false;
  var timeStr = "", dateStr = "", timeLocked = false, editWhen = false;
  var flag = false;
  var toast = null, toastTimer = null;
  var confirmDel = null, lastDeleted = null, delTimer = null;
  var editingId = null, draft = null, notice = "", noticeTimer = null;
  var backupLabel = "Copy backup";
  var plainLabel = "Copy plain text";
  var histQ = "", histAssist = "", histLimit = 40;
  var THEME_KEY = "examlog:theme";
  var themeMode = "auto";
  var restoreFill = "";
  var restoreMsg = "";
  var focusAfter = null;

  function fixSetting(s) {
    var u = (s === "Room" ? "XR" : String(s)).toUpperCase();
    return u === "OR / C-ARM" ? "C-ARM" : u;
  }

  function migrate(p) {
    if (p.v === VERSION) return p;
    var old = {};
    p.cfg.cats.forEach(function (c) { old[c.id] = c; });
    var cats = defaultCats().map(function (c) {
      var o = old[c.id];
      if (o) {
        c.on = o.on; c.options = o.options;
        if (typeof o.multi === "boolean") c.multi = o.multi;
        if (c.id === "exam") {
          var custom = o.options.filter(function (x) {
            return OLD_PARTS.indexOf(x) === -1 && DEFAULT_PARTS.indexOf(x) === -1;
          });
          c.options = DEFAULT_PARTS.slice().concat(custom);
        }
        if (c.id === "setting") {
          c.options = c.options.map(fixSetting);
          if (c.options.indexOf("DEXA") === -1) c.options.push("DEXA");
          c.options = c.options.filter(function (x, i, a) { return a.indexOf(x) === i; });
        }
        if (c.id === "tech") {
          SHEET_TECHS.forEach(function (n) { if (c.options.indexOf(n) === -1) c.options.push(n); });
        }
      }
      return c;
    });
    p.cfg.cats.forEach(function (c) { if (c.custom) cats.push(c); });
    p.cfg.cats = cats;
    (p.entries || []).forEach(function (e) {
      (e.parts || []).forEach(function (x) { if (PART_RENAME[x.p]) x.p = PART_RENAME[x.p]; });
      (e.vals || []).forEach(function (v) {
        if (v.id === "setting") {
          v.v = Array.isArray(v.v) ? v.v.map(fixSetting) : fixSetting(v.v);
        }
        if (v.id === "exam" && PART_RENAME[v.v]) v.v = PART_RENAME[v.v];
      });
    });
    p.v = VERSION;
    return p;
  }

  function load() {
    try {
      var r = localStorage.getItem(KEY);
      if (r) {
        var p = JSON.parse(r);
        if (p && p.cfg && Array.isArray(p.cfg.cats) && Array.isArray(p.entries)) {
          state = migrate(p);
        }
      }
    } catch (e) { /* storage empty or blocked */ }
    ensureState();
    persist();
  }
  function ensureState() {
    if (!state.sync) state.sync = { on: false, id: "", tabId: 0, title: "" };
    if (!Array.isArray(state.dq)) state.dq = [];
    if (!state.tomb) state.tomb = {};
    if (!state.cfgU) state.cfgU = 0;
  }
  var DRAFT_KEY = "examlog:draft";
  function saveDraft() {
    try {
      if (editingId || !anySelected()) { localStorage.removeItem(DRAFT_KEY); return; }
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ sel: sel, parts: parts, pendP: pendP, pendV: pendV, dateStr: dateStr, timeStr: timeStr, timeLocked: timeLocked, at: Date.now() }));
    } catch (e) { /* optional */ }
  }
  function restoreDraft() {
    try {
      var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
      if (!d || Date.now() - d.at > 6 * 3600 * 1000) { localStorage.removeItem(DRAFT_KEY); return; }
      sel = d.sel || {}; parts = d.parts || []; pendP = d.pendP || null; pendV = d.pendV || null;
      if (d.timeLocked) { timeLocked = true; timeStr = d.timeStr; dateStr = d.dateStr; }
      advance();
    } catch (e) { /* ignore */ }
  }
  function applyTheme(mode) {
    themeMode = (mode === "dark" || mode === "light") ? mode : "auto";
    if (themeMode === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = themeMode;
    try {
      if (themeMode === "auto") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, themeMode);
    } catch (e) { /* optional */ }
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) {
      var m = metas[i];
      if (themeMode === "dark") m.setAttribute("content", "#0B1218");
      else if (themeMode === "light") m.setAttribute("content", "#EDEFF3");
      else m.setAttribute("content", (m.getAttribute("media") || "").indexOf("dark") !== -1 ? "#0B1218" : "#EDEFF3");
    }
  }
  function loadTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      applyTheme(t === "dark" || t === "light" ? t : "auto");
    } catch (e) { applyTheme("auto"); }
  }
  function rawSave() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageFailed = false; }
    catch (e) { storageFailed = true; }
  }
  function persist() { rawSave(); cloudNote(); }

  /* ---------- time helpers ---------- */
  function nowParts() {
    var d = new Date();
    return {
      date: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()),
      time: pad(d.getHours()) + ":" + pad(d.getMinutes())
    };
  }
  function fmtTime(t) {
    var p = t.split(":").map(Number);
    var h = p[0], m = p[1];
    return (((h + 11) % 12) + 1) + ":" + pad(m) + " " + (h >= 12 ? "PM" : "AM");
  }
  function toDate(ds) {
    var p = ds.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function fmtDateLong(ds) {
    return toDate(ds).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  }
  function dateHeading(ds) {
    var dt = toDate(ds);
    var t = new Date();
    var today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    var diff = Math.round((today - dt) / 86400000);
    var exact = fmtDateLong(ds);
    if (diff === 0) return "Today, " + exact;
    if (diff === 1) return "Yesterday, " + exact;
    return exact;
  }
  function syncWhen() {
    var wt = $("#whenTime"); if (wt) wt.textContent = fmtTime(timeStr);
    var wd = $("#whenDate"); if (wd) wd.textContent = fmtDateLong(dateStr);
    var i = $("#timeInput"); if (i && i.value !== timeStr) i.value = timeStr;
    var di = $("#dateInput"); if (di && di.value !== dateStr) di.value = dateStr;
  }
  function tick() {
    if (timeLocked) return;
    var p = nowParts();
    timeStr = p.time; dateStr = p.date;
    syncWhen();
  }
  function nudgeTime(mins) {
    var dp = dateStr.split("-").map(Number);
    var tp = timeStr.split(":").map(Number);
    var d = new Date(dp[0], dp[1] - 1, dp[2], tp[0], tp[1] + mins);
    dateStr = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    timeStr = pad(d.getHours()) + ":" + pad(d.getMinutes());
    timeLocked = true;
  }

  /* ---------- selection helpers ---------- */
  function findCat(id) { return state.cfg.cats.find(function (c) { return c.id === id; }); }
  function isPartCat(c) { return c.id === "exam" || c.id === "views"; }
  function activeCats() {
    var list = state.cfg.cats.filter(function (c) { return c.on && c.options.length && !isPartCat(c); });
    return list.filter(function (c) { return c.id !== "special"; }).concat(list.filter(function (c) { return c.id === "special"; }));
  }
  function hasVal(c) {
    var s = sel[c.id];
    return c.multi ? Array.isArray(s) && s.length > 0 : !!s;
  }
  function isPicked(c, o) {
    var s = sel[c.id];
    return c.multi ? Array.isArray(s) && s.indexOf(o) !== -1 : s === o;
  }
  function missingCats() {
    return activeCats().filter(function (c) { return !hasVal(c) && !c.optional; });
  }
  function partsAvailable() {
    var pc = findCat("exam"), vc = findCat("views");
    return !!(pc && vc && pc.options.length && vc.options.length);
  }
  function partsIssue() {
    if (!partsAvailable()) return "";
    if (pendP && !pendV) return "Views for " + pendP;
    if (pendV && !pendP) return "Body part for " + pendV + "v";
    if (!parts.length) return "Body part and views";
    return "";
  }
  function missingItems() {
    var out = [];
    var pi = partsIssue();
    if (pi) out.push(pi);
    missingCats().forEach(function (c) { out.push(c.label); });
    return out;
  }
  function anySelected() {
    return Object.keys(sel).length > 0 || parts.length > 0 || !!pendP || !!pendV;
  }
  function partLabel(x) { return x.n ? x.p + " " + x.n + "v" : x.p; }
  function isFluoroPart(v) { return FLUORO.indexOf(v) !== -1; }
  function partsOf(e) {
    if (Array.isArray(e.parts)) return e.parts.map(function (x) { return { p: x.p, n: x.n }; });
    var p = null, n = null;
    (e.vals || []).forEach(function (v) {
      if (v.id === "exam") p = asArray(v.v)[0];
      if (v.id === "views") n = asArray(v.v)[0];
    });
    return p && n ? [{ p: p, n: n }] : [];
  }
  function summaryText() {
    var bits = [];
    if (parts.length) bits.push(parts.map(partLabel).join(", "));
    activeCats().forEach(function (c) { if (hasVal(c)) bits.push(asArray(sel[c.id]).join(", ")); });
    return bits.join(" | ");
  }
  function colMin(options) {
    var m = 0;
    options.forEach(function (o) { if (o.length > m) m = o.length; });
    return m <= 3 ? 56 : (m <= 10 && options.length <= 4) ? 72 : 100;
  }

  /* ---------- rendering ---------- */
  function mark(st) {
    var sym = st === "done" ? "\u2713" : st === "flag" ? "!" : "";
    var txt = st === "done" ? "Done. " : st === "flag" ? "Needed. " : "";
    return '<span class="mark ' + st + '" aria-hidden="true">' + sym + "</span>" + (txt ? '<span class="sr">' + txt + "</span>" : "");
  }

  function renderHeader() {
    var today = nowParts().date;
    var n = state.entries.filter(function (e) { return e.date === today; }).length;
    $("#top").innerHTML = "<h1>Exam log</h1><div class=\"topr\">" + syncChip() + (n ? '<span class="today" aria-live="polite">' + n + " today</span>" : "") + "</div>";
    var tabs = [["log", "Log"], ["history", "History"], ["options", "Options"]];
    $("#tabs").innerHTML = tabs.map(function (t) {
      var extra = t[0] === "history" && state.entries.length ? "<small>" + state.entries.length + "</small>" : "";
      return '<button class="tab" role="tab" data-act="view" data-view="' + t[0] + '" aria-selected="' + (view === t[0]) + '">' + t[1] + extra + "</button>";
    }).join("");
    $("#banner").innerHTML = storageFailed
      ? '<p class="banner">This browser can’t save data. Use Copy backup in Options often so nothing is lost.</p>' : "";
  }

  function renderWhen() {
    var live = !timeLocked;
    var h = '<section class="when"><div class="whenrow"><div><span class="whentime" id="whenTime">' + esc(fmtTime(timeStr)) + '</span>' +
      '<span class="whendate" id="whenDate">' + esc(fmtDateLong(dateStr)) + "</span></div>" +
      '<div class="whenside"><span class="livetag' + (live ? " live" : "") + '">' + (live ? "Live" : "Set") + "</span>" +
      '<button class="btn small" data-act="editwhen" aria-expanded="' + editWhen + '">' + (editWhen ? "Done" : "Change") + "</button></div></div>" +
      '<div class="nudges" role="group" aria-label="Quick time adjustments">' +
      '<button class="nudge" data-act="nudge" data-min="-5">&minus;5m</button>' +
      '<button class="nudge" data-act="nudge" data-min="-10">&minus;10m</button>' +
      '<button class="nudge" data-act="nudge" data-min="-15">&minus;15m</button>' +
      '<button class="nudge reset" data-act="now">Now</button></div></section>';
    if (editWhen) {
      h += '<div class="whenedit"><label>Time<input id="timeInput" type="time" value="' + esc(timeStr) + '"></label>' +
        '<label>Date<input id="dateInput" type="date" value="' + esc(dateStr) + '"></label>' +
        "<p>Live follows the clock until you tap an option. Changing the time or date sets it.</p>" +
        '<button class="btn" data-act="now">Use the current time</button></div>';
    }
    return h;
  }

  /* ---------- step-by-step logging ---------- */
  function orderedOptions(c) {
    if (c.id !== "tech") return c.options;
    var seen = [];
    sortedEntries().forEach(function (e) {
      (e.vals || []).forEach(function (v) {
        if (v.id !== "tech") return;
        asArray(v.v).forEach(function (n) {
          if (seen.indexOf(n) === -1 && c.options.indexOf(n) !== -1) seen.push(n);
        });
      });
    });
    return seen.concat(c.options.filter(function (o) { return seen.indexOf(o) === -1; }));
  }

  function requiredCats() { return activeCats().filter(function (c) { return !c.optional; }); }
  function optionalCats() { return activeCats().filter(function (c) { return c.optional; }); }
  function stepIds() { return ["part"].concat(requiredCats().map(function (c) { return c.id; })); }
  function stepDone(id) {
    if (id === "part") return !partsIssue();
    var c = findCat(id);
    return !c || hasVal(c);
  }
  function firstIncomplete() {
    var ids = stepIds();
    for (var i = 0; i < ids.length; i++) { if (!stepDone(ids[i])) return ids[i]; }
    return "review";
  }
  function goStep(id) { step = id; pstage = "region"; regionSel = null; pendP = null; techAll = false; topNext = true; }
  function advance() { goStep(firstIncomplete()); }
  function stepLabel(id) {
    if (id === "part") return "Body part";
    if (id === "review") return "Review";
    var c = findCat(id);
    return c ? c.label : id;
  }
  function stepValue(id) {
    if (id === "part") return parts.map(partLabel).join(", ");
    var c = findCat(id);
    return c && hasVal(c) ? asArray(sel[id]).join(", ") : "";
  }
  function canGoBack() { return !(step === "part" && pstage === "region"); }
  function goBack() {
    topNext = true;
    if (step === "part" && pstage === "views") { pendP = null; pstage = regionSel ? "parts" : "region"; return; }
    if (step === "part" && pstage === "parts") { pstage = "region"; regionSel = null; return; }
    var ids = stepIds().concat(["review"]);
    var i = ids.indexOf(step);
    if (i > 0) goStep(ids[i - 1]);
  }

  function wizPick(catId, val) {
    var c = findCat(catId);
    if (!c) return;
    timeLocked = true;
    if (c.multi) {
      var arr = Array.isArray(sel[catId]) ? sel[catId].slice() : [];
      var i = arr.indexOf(val);
      if (i === -1) arr.push(val); else arr.splice(i, 1);
      arr.sort(function (a, b) { return c.options.indexOf(a) - c.options.indexOf(b); });
      if (arr.length) sel[catId] = arr; else delete sel[catId];
    } else if (c.optional) {
      if (sel[catId] === val) delete sel[catId]; else sel[catId] = val;
    } else {
      sel[catId] = val;
      advance();
    }
  }

  function addPart(p, n) {
    timeLocked = true;
    var was = parts.length > 0;
    parts.push({ p: p, n: n || "" });
    if (isFluoroPart(p)) {
      var sc = findCat("setting");
      if (sc && sc.on && sc.options.indexOf("FLUORO") !== -1) {
        sel.setting = sc.multi ? ["FLUORO"] : "FLUORO";
      }
    }
    pendP = null; pstage = "region"; regionSel = null; topNext = true;
    if (!was) advance();
  }
  function pickPart(act, val) {
    timeLocked = true;
    if (act === "pickpart") {
      if (isFluoroPart(val)) { var v0 = pendV; pendV = null; addPart(val, v0 || ""); return; }
      pendP = val; pstage = "views"; topNext = true;
      if (pendV) { var n0 = pendV; pendV = null; addPart(val, n0); }
    } else if (pendP) {
      addPart(pendP, val);
    } else {
      pendV = val;
    }
  }

  function renderStrip() {
    var ids = stepIds();
    var all = firstIncomplete() === "review";
    var h = '<nav class="strip" aria-label="Exam steps">';
    ids.forEach(function (id) {
      var done = stepDone(id);
      var lbl = STEP_SHORT[id] || stepLabel(id);
      h += '<button class="seg' + (step === id ? " cur" : "") + (done ? " done" : "") + '" data-act="step" data-step="' + id + '">' +
        '<span class="segl">' + esc(lbl) + '</span><span class="segv">' + (done ? esc(stepValue(id)) : "") + "</span></button>";
    });
    h += '<button class="seg' + (step === "review" ? " cur" : "") + (all ? " done" : "") + '" data-act="step" data-step="review">' +
      '<span class="segl">Save</span><span class="segv">' + (all ? "Ready" : "") + "</span></button></nav>";
    return h;
  }

  function renderPartStep() {
    if (!partsAvailable()) {
      return '<h2 class="steph">Body part</h2><p class="note">Add body parts and view counts in Options first. <button class="link" data-act="view" data-view="options">Open Options</button></p>';
    }
    var pc = findCat("exam"), vc = findCat("views");
    var h = "";
    if (parts.length) {
      h += '<div class="added">' + parts.map(function (x, i) {
        return '<span class="partchip">' + esc(partLabel(x)) + '<button aria-label="Remove ' + esc(partLabel(x)) + '" data-act="rmpart" data-i="' + i + '">&times;</button></span>';
      }).join("") + "</div>";
    }
    var used = {}, groups = [];
    REGIONS.forEach(function (r) {
      var opts = pc.options.filter(function (o) { return r[1].indexOf(o) !== -1; });
      opts.forEach(function (o) { used[o] = true; });
      if (opts.length) groups.push([r[0], opts]);
    });
    var rest = pc.options.filter(function (o) { return !used[o]; });
    if (rest.length) groups.push(["Other", rest]);
    var cur = groups.filter(function (g) { return g[0] === regionSel; })[0];

    if (pstage === "views" && pendP) {
      return h + '<h2 class="steph">' + esc(pendP) + ", how many views?</h2>" +
        '<div class="tiles c3">' + vc.options.map(function (o) {
          return '<button class="tile big" data-act="pickviews" data-val="' + esc(o) + '">' + esc(o) + "</button>";
        }).join("") + "</div>";
    }
    if (pstage === "parts" && cur) {
      return h + '<h2 class="steph">' + esc(cur[0]) + "</h2>" + '<div class="tiles c3">' + cur[1].map(function (o) {
        return '<button class="tile sm" data-act="pickpart" data-val="' + esc(o) + '">' + esc(o) + "</button>";
      }).join("") + "</div>";
    }
    h += '<h2 class="steph">' + (parts.length ? "Add another body part" : "Body part") + "</h2>";
    return h + '<div class="tiles c2">' + groups.map(function (g) {
      return '<button class="tile reg" data-act="region" data-region="' + esc(g[0]) + '">' + esc(g[0]) + "</button>";
    }).join("") + "</div>";
  }

  function renderCatStep(c) {
    var opts = orderedOptions(c);
    var h = '<h2 class="steph">' + esc(c.label) + (c.multi ? '<span class="steph-sub">pick all, then tap Done</span>' : "") + "</h2>";
    var more = false;
    if (c.id === "tech" && opts.length > 6 && !techAll) {
      var chosen = asArray(sel[c.id] || []).filter(function (o) { return o; });
      var top = opts.slice(0, 6).filter(function (o) { return chosen.indexOf(o) === -1; });
      opts = chosen.concat(top).slice(0, Math.max(6, chosen.length));
      more = true;
    }
    var cols = c.id === "tech" ? "c2" : (opts.length <= 3 ? "c1" : (opts.length <= 6 ? "c2" : "c3"));
    h += '<div class="tiles ' + cols + '">' + opts.map(function (o) {
      return '<button class="tile' + (cols === "c3" ? " sm" : "") + '" aria-pressed="' + isPicked(c, o) + '" data-act="pick" data-cat="' + c.id + '" data-val="' + esc(o) + '">' + esc(o) + "</button>";
    }).join("") + "</div>";
    if (c.id === "tech" && (more || techAll)) {
      h += '<button class="btn wide moretech" data-act="techall">' + (techAll ? "Show fewer names" : "All names (" + c.options.length + ")") + "</button>";
    }
    return h;
  }

  function renderReview() {
    var rows = [["part", "Body part"]].concat(requiredCats().map(function (c) { return [c.id, c.label]; }));
    var h = '<h2 class="steph">Review</h2><div class="rv">' + rows.map(function (r) {
      var done = stepDone(r[0]);
      return '<button class="rvrow' + (done ? "" : " todo") + '" data-act="step" data-step="' + r[0] + '"><span class="rvl">' + esc(r[1]) +
        '</span><span class="rvv">' + (done ? esc(stepValue(r[0])) : "Not chosen yet") + '</span><span class="rvgo">' + (done ? "Change" : "Add") + "</span></button>";
    }).join("") + "</div>";
    if (partsAvailable() && parts.length) {
      h += '<button class="btn wide addpartbtn" data-act="addpart">+ Add another body part</button>';
    }
    optionalCats().forEach(function (c) {
      h += '<p class="sublabel">' + esc(c.label) + " (optional)</p>" + '<div class="tiles c2">' + c.options.map(function (o) {
        return '<button class="tile sm" aria-pressed="' + isPicked(c, o) + '" data-act="pick" data-cat="' + c.id + '" data-val="' + esc(o) + '">' + esc(o) + "</button>";
      }).join("") + "</div>";
    });
    return h + renderWhen() + '<p class="note"><button class="link" data-act="clear">Start over</button></p>';
  }

  function editBanner() {
    var o = state.entries.find(function (x) { return x.id === editingId; });
    if (!o) return "";
    return '<div class="editbanner" role="status"><div><strong>Editing an exam</strong><span>Originally logged ' + esc(fmtDateLong(o.date) + ", " + fmtTime(o.time)) +
      '</span></div><button class="bn" data-act="canceledit">Cancel</button></div>';
  }

  function renderLog() {
    if (step !== "review" && stepIds().indexOf(step) === -1) step = firstIncomplete();
    var body = step === "review" ? renderReview() : (step === "part" ? renderPartStep() : renderCatStep(findCat(step)));
    return (editingId ? editBanner() : "") + renderStrip() + '<section class="wiz">' + body + "</section>";
  }

  function sortedEntries() {
    return state.entries.slice().sort(function (a, b) {
      return (b.date + " " + b.time).localeCompare(a.date + " " + a.time);
    });
  }

  function undoStrip() {
    return (notice ? '<div class="undostrip" role="status"><span>' + esc(notice) + "</span></div>" : "") +
      (lastDeleted ? '<div class="undostrip" role="status"><span>Exam deleted.</span><button data-act="undodel">Undo</button></div>' : "");
  }

  function matchesQuery(e, q) {
    var needle = String(q || "").toLowerCase().trim();
    if (!needle) return true;
    var hay = [
      e.date, dateFull(e.date), fmtDateLong(e.date), fmtTime(e.time),
      partsOf(e).map(partLabel).join(" ")
    ];
    (e.vals || []).forEach(function (v) { hay.push(asArray(v.v).join(" ")); });
    var text = hay.join(" ").toLowerCase();
    return needle.split(/\s+/).every(function (w) { return text.indexOf(w) !== -1; });
  }

  function renderHistoryBody(allList) {
    var searched = allList.filter(function (e) { return matchesQuery(e, histQ); });
    var cO = 0, cA = 0, cU = 0;
    searched.forEach(function (e) {
      var code = assistCode(valOf(e, "assist"));
      if (code === "O") cO++;
      else if (code === "A") cA++;
      else if (code === "U") cU++;
    });
    var pills = [
      ["", "All", searched.length],
      ["O", "Observed", cO],
      ["A", "Assisted", cA],
      ["U", "Unassisted", cU]
    ];
    var h = '<div class="stats" role="group" aria-label="Filter by assistance">' + pills.map(function (p) {
      return '<button class="stat" data-act="histfilter" data-code="' + p[0] + '" aria-pressed="' + (histAssist === p[0]) + '">' +
        "<strong>" + p[2] + "</strong><span>" + p[1] + "</span></button>";
    }).join("") + "</div>";
    var shown = histAssist ? searched.filter(function (e) { return assistCode(valOf(e, "assist")) === histAssist; }) : searched;
    if (!shown.length) {
      return h + '<div class="empty"><h2>No matching exams</h2><p>Try a different search or filter.</p></div>';
    }
    var counts = {};
    shown.forEach(function (e) { counts[e.date] = (counts[e.date] || 0) + 1; });
    var visible = shown.slice(0, histLimit);
    var lastDate = "";
    visible.forEach(function (e) {
      if (e.date !== lastDate) {
        h += '<h2 class="dayhead"><span>' + esc(dateHeading(e.date)) + "</span><span>" + counts[e.date] + " exam" + (counts[e.date] === 1 ? "" : "s") + "</span></h2>";
        lastDate = e.date;
      }
      h += '<article class="entry"><div class="etop"><div class="etl"><strong>' + esc(fmtTime(e.time)) + "</strong>" + sheetMark(e) + "</div>" +
        '<div class="eact"><button class="del edit" data-act="editentry" data-id="' + e.id + '">Edit</button><button class="del" data-act="askdel" data-id="' + e.id + '">Delete…</button></div></div>' +
        '<div class="tags">' + (Array.isArray(e.parts) ? e.parts : []).map(function (x) {
          return '<span class="tag views" title="Body part and views">' + esc(partLabel(x)) + "</span>";
        }).join("") + e.vals.map(function (v) {
          return asArray(v.v).map(function (x) {
            var isV = v.id === "views";
            return '<span class="tag" title="' + esc(v.l) + '">' + esc(x) + (isV ? (x === "1" ? " view" : " views") : "") + "</span>";
          }).join("");
        }).join("") + "</div>" + entryNote(e) + "</article>";
    });
    if (shown.length > visible.length) {
      var rem = shown.length - visible.length;
      h += '<button class="btn wide showmore" data-act="histmore">Show more (' + rem + " older exam" + (rem === 1 ? "" : "s") + ")</button>";
    }
    return h;
  }

  function renderHistory() {
    var list = sortedEntries();
    if (!list.length) {
      return undoStrip() + renderSyncCard() + '<div class="empty"><h2>No exams logged yet</h2><p>Saved exams show up here, newest first.</p></div>';
    }
    return undoStrip() + renderSyncCard() +
      '<div class="searchbar"><input type="search" id="histSearch" placeholder="Search body part, tech, setting, date…" value="' + esc(histQ) + '" autocomplete="off" spellcheck="false">' +
      '<button class="searchclr" id="histClear" data-act="clearsearch" aria-label="Clear search"' + (histQ ? "" : " hidden") + '>&times;</button></div>' +
      '<div id="histBody">' + renderHistoryBody(list) + "</div>";
  }

  function renderOptions() {
    var h = '<section class="opt opt-first"><div class="opthead"><h2>Appearance</h2></div>' +
      '<p class="hint">Use Dark in dim exam or fluoro rooms, or Auto to match your phone.</p>' +
      '<div class="tiles c3">' + [["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]].map(function (t) {
        return '<button class="tile sm" data-act="theme" data-theme="' + t[0] + '" aria-pressed="' + (themeMode === t[0]) + '">' + t[1] + "</button>";
      }).join("") + "</div></section>" +
      '<p class="hint">Change what you tap in the Log tab. Turn a group off to skip it, allow more than one pick, or add your own groups.</p>';
    state.cfg.cats.forEach(function (c) {
      h += '<section class="opt"><div class="opthead"><h2>' + esc(c.label) + "</h2></div>" +
        (isPartCat(c) ? '<p class="hint">Used together in the Log tab. Each body part you add gets its own view count.</p>' :
        '<div class="switches">' +
        '<label class="switch"><input type="checkbox" data-act="toggle" data-cat="' + c.id + '"' + (c.on ? " checked" : "") + "> Ask for this</label>" +
        '<label class="switch"><input type="checkbox" data-act="multi" data-cat="' + c.id + '"' + (c.multi ? " checked" : "") + "> Allow more than one</label>" +
        '<label class="switch"><input type="checkbox" data-act="req" data-cat="' + c.id + '"' + (c.optional ? "" : " checked") + "> Required</label></div>") +
        '<div class="chips">' + c.options.map(function (o) {
          return '<span class="optchip">' + esc(o) + '<button aria-label="Remove ' + esc(o) + '" data-act="rm" data-cat="' + c.id + '" data-val="' + esc(o) + '">&times;</button></span>';
        }).join("") + "</div>" +
        '<div class="addrow"><input type="text" id="add-' + c.id + '" data-add="' + c.id + '" placeholder="' + esc(c.ph || "Add an option") + '" maxlength="40" enterkeyhint="done" autocomplete="off">' +
        '<button class="btn" data-act="add" data-cat="' + c.id + '">Add</button></div>' +
        (c.custom ? '<p class="pgap"><button class="link" data-act="rmcat" data-cat="' + c.id + '">Remove this group</button></p>' : "") +
        "</section>";
    });
    h += '<section class="opt"><div class="opthead"><h2>New group</h2></div><p class="hint">For example: Patient position, Preceptor, Patient type.</p>' +
      '<div class="addrow"><input type="text" id="newcat" placeholder="Group name" maxlength="30" enterkeyhint="done" autocomplete="off">' +
      '<button class="btn" data-act="addcat">Add group</button></div></section>';
    h += '<section class="opt"><div class="opthead"><h2>Back up and restore</h2></div>' +
      '<p class="hint">Your log is stored only on this device. Copy a backup now and then. To restore, or move to a new phone, paste a backup below.</p>' +
      '<div class="optbtns"><button class="btn" data-act="backup">' + esc(backupLabel) + '</button><button class="btn" data-act="copyplain">' + esc(plainLabel) + "</button></div>" +
      '<textarea class="export" id="restoreBox" placeholder="Paste a backup here to restore">' + esc(restoreFill) + "</textarea>" +
      '<button class="btn" data-act="restore">Restore from backup</button>' +
      (restoreMsg ? '<p class="note" role="status">' + esc(restoreMsg) + "</p>" : "") + "</section>";
    return h;
  }

  function renderModal() {
    var m = $("#modal");
    var e = confirmDel ? state.entries.find(function (x) { return x.id === confirmDel; }) : null;
    if (!e) { confirmDel = null; m.innerHTML = ""; document.body.style.overflow = ""; return; }
    document.body.style.overflow = "hidden";
    var tags = (Array.isArray(e.parts) ? e.parts : []).map(function (x) {
      return '<span class="tag views">' + esc(partLabel(x)) + "</span>";
    }).join("") + e.vals.map(function (v) {
      return asArray(v.v).map(function (x) { return '<span class="tag">' + esc(x) + "</span>"; }).join("");
    }).join("");
    m.innerHTML = '<div class="backdrop" data-act="canceldel"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">Delete this exam?</h2>' +
      '<p class="dlgwhen">' + esc(fmtDateLong(e.date) + ", " + fmtTime(e.time)) + "</p>" +
      '<div class="tags">' + tags + "</div>" +
      '<p class="note">This removes it from your log. You’ll have a few seconds to undo.</p>' +
      '<div class="dlgbtns"><button class="btn big keep" id="keepBtn" data-act="canceldel">Keep exam</button>' +
      '<button class="btn big danger" data-act="confirmdel" data-id="' + e.id + '">Delete exam</button></div></div>';
  }

  function fitBar() {
    var bar = $("#bar");
    $("#wrap").style.paddingBottom = (bar.hidden ? 40 : bar.offsetHeight + 12) + "px";
  }

  function renderBar() {
    var bar = $("#bar");
    if (view !== "log") { bar.hidden = true; fitBar(); return; }
    bar.hidden = false;
    var miss = missingItems();
    var primary;
    if (step === "review") {
      primary = miss.length
        ? '<button class="primary incomplete" data-act="finish">Still need: ' + esc(stepLabel(firstIncomplete()).toLowerCase()) + "</button>"
        : '<button class="primary" data-act="save">' + (editingId ? "Save changes" : "Save exam") + "</button>";
    } else if (stepDone(step) && (step !== "part" || pstage === "region")) {
      primary = '<button class="primary" data-act="next">Done</button>';
    } else {
      primary = '<button class="primary incomplete" disabled>Tap an option</button>';
    }
    var h = "";
    if (toast) h += '<div class="toast"><span>' + esc(toast.msg) + '</span><button data-act="undo">Undo</button></div>';
    h += '<div class="btnrow"><button class="btn ghost" data-act="back"' + (canGoBack() ? "" : " disabled") + ">Back</button>" + primary + "</div>";
    $("#barin").innerHTML = h;
    fitBar();
  }

  function render() {
    var y = window.scrollY;
    renderHeader();
    $("#main").innerHTML = view === "log" ? renderLog() : view === "history" ? renderHistory() : renderOptions();
    renderBar();
    renderModal();
    saveDraft();
    window.scrollTo(0, topNext ? 0 : y);
    topNext = false;
    if (focusAfter) {
      var el = document.getElementById(focusAfter);
      if (el) el.focus();
      focusAfter = null;
    }
  }

  /* ---------- actions ---------- */
  function showToast(msg, id) {
    toast = { msg: msg, id: id };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast = null; renderBar(); }, 8000);
  }

  function applyVals(vals) {
    sel = {};
    vals.forEach(function (v) {
      var c = findCat(v.id);
      if (!c || !c.on || isPartCat(c)) return;
      var ok = asArray(v.v).filter(function (o) { return c.options.indexOf(o) !== -1; });
      if (!ok.length) return;
      sel[c.id] = c.multi ? ok : ok[0];
    });
  }

  function startEdit(id) {
    var e = state.entries.find(function (x) { return x.id === id; });
    if (!e) return;
    if (!editingId) {
      draft = {
        sel: JSON.parse(JSON.stringify(sel)),
        parts: parts.map(function (x) { return { p: x.p, n: x.n }; }),
        pendP: pendP, pendV: pendV, timeStr: timeStr, dateStr: dateStr, timeLocked: timeLocked
      };
    }
    var changed = false;
    e.vals.forEach(function (v) {
      var c = findCat(v.id);
      if (!c || !c.on || isPartCat(c)) return;
      asArray(v.v).forEach(function (o) {
        if (c.options.indexOf(o) === -1) { c.options.push(o); changed = true; }
      });
    });
    var pc = findCat("exam"), vc = findCat("views");
    partsOf(e).forEach(function (x) {
      if (pc && x.p && pc.options.indexOf(x.p) === -1) { pc.options.push(x.p); changed = true; }
      if (vc && x.n && vc.options.indexOf(x.n) === -1) { vc.options.push(x.n); changed = true; }
    });
    if (changed) persist();
    sel = {};
    e.vals.forEach(function (v) {
      var c = findCat(v.id);
      if (!c || !c.on || isPartCat(c)) return;
      var arr = asArray(v.v);
      sel[c.id] = c.multi ? arr.slice() : arr[0];
    });
    parts = partsOf(e); pendP = null; pendV = null;
    dateStr = e.date; timeStr = e.time; timeLocked = true; editWhen = false; flag = false;
    editingId = id;
    goStep("review");
    toast = null; clearTimeout(toastTimer);
    view = "log";
    render();
    window.scrollTo(0, 0);
  }

  function leaveEdit(msg) {
    editingId = null;
    if (draft) {
      sel = draft.sel; parts = draft.parts; pendP = draft.pendP; pendV = draft.pendV;
      timeStr = draft.timeStr; dateStr = draft.dateStr; timeLocked = draft.timeLocked;
      draft = null;
    } else {
      sel = {}; parts = []; pendP = null; pendV = null; timeLocked = false;
    }
    flag = false; editWhen = false;
    advance();
    if (!timeLocked) tick();
    view = "history";
    if (msg) {
      notice = msg;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(function () { notice = ""; if (view === "history") render(); }, 4000);
    }
    render();
    window.scrollTo(0, 0);
  }

  function saveEdit() {
    var e = state.entries.find(function (x) { return x.id === editingId; });
    if (!e) { leaveEdit(""); return; }
    var editable = {};
    var vals = [];
    activeCats().forEach(function (c) {
      editable[c.id] = true;
      if (hasVal(c)) vals.push({ id: c.id, l: c.label, v: c.multi ? sel[c.id].slice() : sel[c.id] });
    });
    e.vals.forEach(function (v) {
      if (!editable[v.id] && v.id !== "exam" && v.id !== "views") vals.push(v);
    });
    e.date = dateStr; e.time = timeStr;
    e.parts = parts.map(function (x) { return { p: x.p, n: x.n }; });
    e.vals = vals;
    e.x = false;
    afterEdit(e);
    leaveEdit("Changes saved.");
  }

  function clearAll() {

        var body = e
          ? { id: e.id, date: e.date, time: e.time, parts: clone(e.parts || []), vals: clone(e.vals || []), x: !!e.x, u: eU(e), sh: e.sh || null }

  function mergeRemote(docs) {

      if (!d || !d.exists) return;

      var id = r.id;

      var idx = state.entries.findIndex(function (x) { return x.id === id; });
      var local = idx >= 0 ? state.entries[idx] : null;
      var lu = local ? eU(local) : (state.tomb[id] || 0);
      if ((r.u || 0) <= lu) return;

  /* comparing rows: tolerant of how the sheet displays dates and times */
