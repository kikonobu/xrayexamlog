    await sheetCall("update_spreadsheet", {
      spreadsheetId: state.sync.id,
      requests: [{ updateCells: {
        start: { sheetId: state.sync.tabId, rowIndex: rowNum - 1, columnIndex: 0 },
        rows: [{ values: cellsFor(row) }],
        fields: "userEnteredValue,userEnteredFormat.numberFormat"
      } }]
    });
  }
  async function verifyRow(rowNum, row) {
    var p = await sheetCall("get_values", { spreadsheetId: state.sync.id, range: "'" + TAB + "'!A" + rowNum + ":G" + rowNum });
    var v = p && p.values && p.values[0];
    return !!(v && sameRow(v, row));
  }
  function adopt(e, row) { e.sh = row.slice(); e.sp = ""; e.u = Date.now(); }

  function cellsForAnyRow(raw) {
    var r = pad7(raw);
    var s = function (v) { return v ? { userEnteredValue: { stringValue: v } } : {}; };
    var c0 = s(r[0]);
    var nd = nDate(r[0]);
    if (/^\d{4}-\d{2}-\d{2}$/.test(nd)) {
      var dp = nd.split("-").map(Number);
      var serial = Math.round((Date.UTC(dp[0], dp[1] - 1, dp[2]) - Date.UTC(1899, 11, 30)) / 86400000);
      c0 = { userEnteredValue: { numberValue: serial }, userEnteredFormat: { numberFormat: { type: "DATE", pattern: "mm/dd/yyyy" } } };
    }
    var c1 = s(r[1]);
    var tm = nMin(r[1]);
    if (tm >= 0) {
      var gt = guessTime(r[1]).split(":").map(Number);
      c1 = { userEnteredValue: { numberValue: (gt[0] * 60 + gt[1]) / 1440 }, userEnteredFormat: { numberFormat: { type: "TIME", pattern: "hh:mm" } } };
    }
    return [c0, c1, s(r[2]), s(r[3]), s(r[4]), s(r[5]), s(r[6])];
  }

  function rowSortKey(raw) {
    var nd = nDate(raw[0]);
    var dk = /^\d{4}-\d{2}-\d{2}$/.test(nd) ? nd : "9999-99-99";
    var tk = nMin(raw[1]) >= 0 ? guessTime(raw[1]) : "99:99";
    return dk + " " + tk;
  }

  async function writeAnyRow(rowNum, raw) {
    await sheetCall("update_spreadsheet", {
      spreadsheetId: state.sync.id,
      requests: [{ updateCells: {
        start: { sheetId: state.sync.tabId, rowIndex: rowNum - 1, columnIndex: 0 },
        rows: [{ values: cellsForAnyRow(raw) }],
        fields: "userEnteredValue,userEnteredFormat.numberFormat"
      } }]
    });
  }

  async function deleteRowAt(rowNum) {
    await sheetCall("update_spreadsheet", {
      spreadsheetId: state.sync.id,
      requests: [{ deleteDimension: { range: { sheetId: state.sync.tabId, dimension: "ROWS", startIndex: rowNum - 1, endIndex: rowNum } } }]
    });
  }

  async function cleanAndSortSheet() {
    var rows = await readRows();
    var lastData = 0;
    for (var i = rows.length - 1; i >= 1; i--) {
      if (rows[i] && rows[i].some(function (c) { return String(c || "").trim() !== ""; })) { lastData = i; break; }
    }
    if (lastData < 1) return { dups: 0, sorted: false };

    /* 1. Find exact duplicate rows and interior blank rows, and delete them from bottom to top one row at a time. */
    var seen = [];
    var toDelete = [];
    var dups = 0;
    for (var j = 1; j <= lastData; j++) {
      var r = rows[j];
      var empty = !r || !r.some(function (c) { return String(c || "").trim() !== ""; });
      if (empty) {
        toDelete.push(j + 1);
        continue;
      }
      var p = pad7(r);
      var isDup = seen.some(function (u) { return sameRow(u, p); });
      if (isDup) {
        dups++;
        toDelete.push(j + 1);
      } else {
        seen.push(p);
      }
    }
    for (var d = toDelete.length - 1; d >= 0; d--) {
      await deleteRowAt(toDelete[d]);
    }

    /* 2. Re-read after deletions and sort chronologically via crash-safe cycle shifts
          using one temporary backup row at the bottom so no exam is ever overwritten before it is copied. */
    if (toDelete.length) rows = await readRows();
    var current = [];
    for (var k = 1; k < rows.length; k++) {
      var cr = rows[k];
      if (cr && cr.some(function (c) { return String(c || "").trim() !== ""; })) {
        current.push({ row: pad7(cr), rowNum: k + 1, pos: current.length });
      }
    }
    var ordered = current.slice().sort(function (a, b) {
      var ka = rowSortKey(a.row), kb = rowSortKey(b.row);
      if (ka !== kb) return ka.localeCompare(kb);
      return a.pos - b.pos;
    });
    var n = current.length;
    var src = ordered.map(function (item) { return item.pos; });
    var visited = {};
    var scratchRow = n + 2;
    var usedScratch = false;
    var moved = 0;
    for (var pIdx = n - 1; pIdx >= 0; pIdx--) {
      if (visited[pIdx] || src[pIdx] === pIdx) { visited[pIdx] = true; continue; }
      var cyc = [];
      var cur = pIdx;
      while (!visited[cur]) {
        visited[cur] = true;
        cyc.push(cur);
        cur = src[cur];
      }
      var maxAt = 0;
      for (var c = 1; c < cyc.length; c++) { if (cyc[c] > cyc[maxAt]) maxAt = c; }
      cyc = cyc.slice(maxAt).concat(cyc.slice(0, maxAt));
      await writeAnyRow(scratchRow, current[cyc[0]].row);
      usedScratch = true;
      for (var t = 0; t < cyc.length - 1; t++) {
        await writeAnyRow(current[cyc[t]].rowNum, current[cyc[t + 1]].row);
        moved++;
      }
      await writeAnyRow(current[cyc[cyc.length - 1]].rowNum, current[cyc[0]].row);
      moved++;
    }
    if (usedScratch) await deleteRowAt(scratchRow);
    return { dups: dups, sorted: moved > 0 || toDelete.length > dups };
  }

  function sheetNeedsClean(rows, extraRow) {
    var lastData = 0;
    for (var i = rows.length - 1; i >= 1; i--) {
      if (rows[i] && rows[i].some(function (c) { return String(c || "").trim() !== ""; })) { lastData = i; break; }
    }
    var seen = [];
    var prevKey = "";
    for (var j = 1; j <= lastData; j++) {
      var r = rows[j];
      if (!r || !r.some(function (c) { return String(c || "").trim() !== ""; })) return true;
      var p = pad7(r);
      if (seen.some(function (u) { return sameRow(u, p); })) return true;
      var key = rowSortKey(p);
      if (prevKey && key < prevKey) return true;
      seen.push(p);
      prevKey = key;
    }
    if (extraRow) {
      var ek = rowSortKey(extraRow);
      if (prevKey && ek < prevKey) return true;
    }
    return false;
  }

  async function cleanSheetNow() {
    if (!state.sync.on || sy.busy) return;
    sy.busy = true; sy.err = ""; render();
    try {
      var res = await cleanAndSortSheet();
      var bits = [];
      if (res.dups) bits.push("removed " + res.dups + " duplicate" + (res.dups === 1 ? "" : "s"));
      if (res.sorted) bits.push("sorted by date & time");
      notice = bits.length ? "Sheet updated: " + bits.join(" and ") + "." : "Sheet is already clean and in time order.";
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(function () { notice = ""; if (view === "history") render(); }, 5000);
    } catch (err) { sy.err = sheetErrText(err); }
    sy.busy = false; render();
  }

  async function doAdd(e) {
    if (state.tomb[e.id] || !state.entries.some(function (x) { return x.id === e.id; })) return false;
    var row = sheetRow(e);
    var rows = await readRows();
    if (state.tomb[e.id] || !state.entries.some(function (x) { return x.id === e.id; })) return false;
    if (findRow(rows, row)) { adopt(e, row); return sheetNeedsClean(rows, null); }
    var n = 2;
    for (var i = rows.length - 1; i >= 1; i--) {
      if (rows[i] && String(rows[i][0] || "").trim() !== "") { n = i + 2; break; }
    }
    await writeRow(n, row);
    if (!(await verifyRow(n, row))) { e.sp = "review"; return false; }
    adopt(e, row);
    return sheetNeedsClean(rows, row);
  }
  async function doUpdate(e) {
    var rows = await readRows();
    var row = sheetRow(e);
    var at = e.sh ? findRow(rows, e.sh) : 0;
    if (!at) {
      if (findRow(rows, row)) { adopt(e, row); return; }
      e.sp = "conflict";
      return;
    }
    await writeRow(at, row);
    if (!(await verifyRow(at, row))) { e.sp = "review"; return; }
    adopt(e, row);
  }
  async function doDelete(item) {
    var rows = await readRows();
    var at = findRow(rows, item.snap);
    if (!at) return;
    await sheetCall("update_spreadsheet", {
      spreadsheetId: state.sync.id,
      requests: [{ deleteDimension: { range: { sheetId: state.sync.tabId, dimension: "ROWS", startIndex: at - 1, endIndex: at } } }]
    });
  }

  function pendingCount() {
    return state.entries.filter(function (e) { return e.sp === "add" || e.sp === "update" || e.sp === "check"; }).length + state.dq.length;
  }
  function attentionCount() {
    return state.entries.filter(function (e) { return e.sp === "conflict" || e.sp === "review"; }).length;
  }

  async function runSync() {
    if (!state.sync.on || sy.busy || !pendingCount()) return;
    sy.busy = true; sy.err = ""; render();
    var current = null;
    var needClean = false;
    try {
      while (state.dq.length) {
        await doDelete(state.dq[0]);
        state.dq.shift(); rawSave();
      }
      var ups = state.entries.filter(function (e) { return e.sp === "update"; });
      for (var i = 0; i < ups.length; i++) {
        current = ups[i];
        await doUpdate(current);
        needClean = true;
        rawSave(); cloudPush(current.id);
      }
      var adds = state.entries.filter(function (e) { return e.sp === "add" || e.sp === "check"; }).sort(byTimeAsc);
      for (var j = 0; j < adds.length; j++) {
        current = adds[j];
        if (await doAdd(current)) needClean = true;
        rawSave(); cloudPush(current.id);
      }
      if (needClean) {
        await cleanAndSortSheet();
      }
    } catch (err) {
      if (current && isAmbiguous(err) && (current.sp === "add" || current.sp === "check")) current.sp = "check";
      rawSave();
      sy.err = sheetErrText(err);
    }
    sy.busy = false; render();
    if (!sy.err && state.sync.on && pendingCount()) {
      setTimeout(runSync, 50);
    }
  }

  async function saveBridge() {
    if (sy.busy) return;
    var url = (sy.bUrl || "").trim(), tok = (sy.bTok || "").trim();
    if (!/^https:\/\/script\.google\.com\//.test(url) || !tok) {
      sy.err = "Paste the bridge address (it starts with https://script.google.com) and your secret code.";
      render(); return;
    }
    sy.busy = true; sy.err = ""; render();
    window.claude.__configure(url, tok);
    sy.mcp = undefined;
    try {
      var ping = await window.claude.__ping();
      sy.linkDraft = "https://docs.google.com/spreadsheets/d/" + ping.id + "/edit";
      sy.busy = false;
      cloudInit();
      await connectSheet();
      return;
    } catch (err) {
      window.claude.__forget();
      sy.mcp = undefined;
      sy.err = err.code === "bad_token" ? "The secret code doesn’t match the one in your script."
        : err.code === "server_unavailable" ? "Couldn’t reach the bridge. Check the address and your connection."
        : "The bridge answered with a problem: " + String(err.message || "").slice(0, 120);
    }
    sy.busy = false; render();
  }

  function parseSheetId(str) {
    var m = String(str || "").match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    var t = String(str || "").trim();
    return /^[a-zA-Z0-9_-]{20,}$/.test(t) ? t : "";
  }

  function resetTracking() {
    state.entries.forEach(function (e) {
      if (e.sh || e.sp) { e.sh = null; e.sp = ""; e.u = Date.now(); cloudPush(e.id); }
    });
    state.dq = [];
  }

  async function connectSheet() {
    if (sy.busy) return;
    var id = parseSheetId(sy.linkDraft);
    if (!id) { sy.err = "That doesn’t look like a Google Sheets link."; render(); return; }
    sy.busy = true; sy.err = ""; render();
    try {
      var meta = await sheetCall("get_spreadsheet", { spreadsheetId: id, fields: ["properties.title", "sheets.properties"] });
      var tab = ((meta && meta.sheets) || []).map(function (x) { return x.properties; })
        .find(function (p) { return p && p.title === TAB; });
      if (!tab) throw makeErr("no_tab", "That sheet has no tab named “" + TAB + "”.");
      var head = await sheetCall("get_values", { spreadsheetId: id, range: "'" + TAB + "'!A1:G1" });
      var h = (head && head.values && head.values[0]) || [];
      if (!/^date/i.test(String(h[0] || "")) || !/exam/i.test(String(h[3] || ""))) {
        throw makeErr("bad_header", "The first row of “" + TAB + "” doesn’t have the columns I expect, so I didn’t connect.");
      }
      if (state.sync.id && state.sync.id !== id) resetTracking();
      state.sync = { on: true, id: id, tabId: tab.sheetId, title: (meta.properties && meta.properties.title) || "Google Sheet" };
      rawSave();
      sy.linkDraft = "";
      await reconcile();
    } catch (err) { sy.err = sheetErrText(err); }
    sy.busy = false; render();
  }

  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function catLabel(id, fallback) { var c = findCat(id); return c ? c.label : fallback; }

  /* Sheet times like 130 or 1045 carry no AM/PM, so afternoon hours 1 to 6 are read as 13:00 to 18:00. */
  function guessTime(str) {
    var t = String(str || "").trim();
    var ct = parseColonTime(t);
    if (ct) return pad(ct.h) + ":" + pad(ct.m);
    if (/^\d+$/.test(t)) {
      var hh, mm;
      if (t.length <= 2) { hh = Number(t); mm = 0; } else { hh = Number(t.slice(0, -2)); mm = Number(t.slice(-2)); }
      if (hh >= 1 && hh <= 6) hh += 12;
      if (hh > 23 || mm > 59) return "00:00";
      return pad(hh) + ":" + pad(mm);
    }
    return "00:00";
  }

  function entryFromRow(row) {
    var r = pad7(row);
    var parts = r[3].split(",").map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) {
      var m = t.match(/^(.*?)\s*(\d+)\s*v$/i);
      return m && m[1] ? { p: m[1].trim(), n: m[2] } : { p: t, n: "" };
    });
    var vals = [];
    if (r[2].trim()) vals.push({ id: "setting", l: catLabel("setting", "Setting"), v: r[2].trim().toUpperCase() });
    var a = { O: "Observed", A: "Assisted", U: "Unassisted" }[r[4].trim().toUpperCase()];
    if (a) vals.push({ id: "assist", l: catLabel("assist", "Assistance"), v: a });
    var techs = r[6].split("/").map(function (t) { return t.trim(); }).filter(Boolean);
    if (techs.length) vals.push({ id: "tech", l: catLabel("tech", "Tech"), v: techs });
    if (r[5].trim()) vals.push({ id: "special", l: catLabel("special", "Special population"), v: r[5].trim() });
    return { id: newId(), date: nDate(r[0]), time: guessTime(r[1]), parts: parts, vals: vals, x: true, u: Date.now(), sh: r.slice(), imp: true };
  }

  async function reconcile() {
    var rows = await readRows();
    var used = {};
    var rec = { read: Math.max(0, rows.length - 1), matched: 0, byTime: 0, missing: [], imports: [], newTechs: [] };
    var i;
    var techCat = findCat("tech");
    if (techCat) {
      var have = {};
      techCat.options.forEach(function (o) { have[nStr(o)] = true; });
      rows.slice(1).forEach(function (r) {
        String((r && r[6]) || "").split("/").forEach(function (n) {
          var t = n.trim();
          if (t && !have[nStr(t)]) { have[nStr(t)] = true; techCat.options.push(t); rec.newTechs.push(t); }
        });
      });
      if (rec.newTechs.length) persist();
    }
    state.entries.forEach(function (e) {
      if (!e.sh) return;
      var found = false;
      for (var k = 1; k < rows.length; k++) {
        if (!used[k] && rows[k] && sameRow(rows[k], e.sh)) { used[k] = true; found = true; rec.matched++; break; }
      }
      if (!found) { e.sh = null; e.u = Date.now(); cloudPush(e.id); }
    });
    var todo = state.entries.filter(function (e) { return !e.sh && !e.sp; }).sort(byTimeAsc);
    todo.forEach(function (e) {
      var row = sheetRow(e);
      var hit = -1, how = "matched", i;
      for (i = 1; i < rows.length; i++) {
        if (used[i] || !rows[i]) continue;
        if (nDate(rows[i][0]) === nDate(row[0]) && nMin(rows[i][1]) >= 0 && nMin(rows[i][1]) % 720 === nMin(row[1]) % 720 && nText(rows[i][3]) === nText(row[3])) { hit = i; break; }
      }
      if (hit < 0) {
        for (i = 1; i < rows.length; i++) {
          if (used[i] || !rows[i]) continue;
          if (nDate(rows[i][0]) === nDate(row[0]) && nMin(rows[i][1]) >= 0 && nMin(rows[i][1]) % 720 === nMin(row[1]) % 720) { hit = i; how = "byTime"; break; }
        }
      }
      if (hit >= 0) {
        used[hit] = true;
        e.sh = pad7(rows[hit]); e.u = Date.now();
        rec[how]++;
        cloudPush(e.id);
      } else { rec.missing.push(e.id); }
    });
    for (i = 1; i < rows.length; i++) {
      if (used[i] || !rows[i]) continue;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(nDate(rows[i][0])) || !String(rows[i][3] || "").trim()) continue;
      rec.imports.push(entryFromRow(rows[i]));
    }
    sy.rec = rec; sy.off = {}; sy.impOff = {};
    rawSave();
    return rec;
  }

  function importRows() {
    var rec = sy.rec;
    if (!rec || !rec.imports) return;
    var n = 0;
    rec.imports.forEach(function (e) {
      if (sy.impOff[e.id]) return;
      state.entries.push(e); n++;
      cloudPush(e.id);
    });
    rec.imports = [];
    rawSave();
    notice = "Imported " + n + " exam" + (n === 1 ? "" : "s") + " from the sheet.";
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(function () { notice = ""; if (view === "history") render(); }, 5000);
    render();
  }

  async function checkSheet() {
    if (!state.sync.on || sy.busy) return;
    sy.busy = true; sy.err = ""; render();
    try { await reconcile(); } catch (err) { sy.err = sheetErrText(err); }
    sy.busy = false; render();
  }

  function sendMissing() {
    var rec = sy.rec;
    if (!rec) return;
    rec.missing.forEach(function (id) {
      if (sy.off[id]) return;
      var e = state.entries.find(function (x) { return x.id === id; });
      if (e && !e.sh && !e.sp) { e.sp = "add"; e.u = Date.now(); cloudPush(e.id); }
    });
    sy.rec = null;
    rawSave();
    render();
    runSync();
  }

  function untrack(id) {
    var e = state.entries.find(function (x) { return x.id === id; });
    if (!e) return;
    if (e.sp === "review") e.sh = sheetRow(e); else e.sh = null;
    e.sp = ""; e.u = Date.now();
    rawSave(); cloudPush(e.id); render();
  }

  /* --- hooks called wherever an exam changes --- */
  function afterAdd(e) {
    e.u = Date.now();
    if (state.sync.on) e.sp = "add";
    persist(); cloudPush(e.id); runSync();
  }
  function afterEdit(e) {
    e.u = Date.now();
    if (e.sh && e.sp !== "add" && e.sp !== "check") e.sp = "update";
    persist(); cloudPush(e.id); runSync();
  }
  function afterDelete(e) {
    state.tomb[e.id] = Date.now();
    if (e.sh) state.dq.push({ id: e.id, snap: e.sh.slice() });
    else if (state.sync.on && (e.sp === "add" || e.sp === "check" || sy.busy)) state.dq.push({ id: e.id, snap: sheetRow(e) });
    persist(); cloudPush(e.id); runSync();
  }
  function afterRestore(e) {
    delete state.tomb[e.id];
    var qi = state.dq.findIndex(function (x) { return x.id === e.id; });
    if (qi >= 0) {
      state.dq.splice(qi, 1);
      if (!e.sh && state.sync.on) e.sp = "add";
    } else if (e.sh) {
      e.sh = null;
      if (state.sync.on) e.sp = "add";
    } else if (state.sync.on) {
      e.sp = "add";
    }
    e.u = Date.now();
    persist(); cloudPush(e.id); runSync();
  }

  /* --- sync screens --- */
  function syncChip() {
    if (!state.sync.on) return "";
    var n = pendingCount(), a = attentionCount();
    if (sy.busy) return '<button class="today syn" data-act="syncchip">Sheet: sending</button>';
    if (sy.err || a) return '<button class="today synwarn" data-act="syncchip">Sheet: needs attention</button>';
    if (n) return '<button class="today synwait" data-act="syncchip">Sheet: ' + n + " waiting</button>";
    return '<button class="today synok" data-act="syncchip">Sheet: synced</button>';
  }
  function sheetMark(e) {
    if (!state.sync.on) return "";
    if (e.sp === "conflict" || e.sp === "review") return '<span class="smark warn">Check sheet</span>';
    if (e.sp) return '<span class="smark wait">Waiting</span>';
    if (e.sh) return '<span class="smark ok">In sheet</span>';
    return '<span class="smark">Not in sheet</span>';
  }
  function entryNote(e) {
    if (e.sp === "conflict") {
      return '<p class="note warnt">This exam’s row in the sheet was changed or moved, so I didn’t touch it. <button class="link" data-act="untrack" data-id="' + e.id + '">Stop syncing this exam</button></p>';
    }
    if (e.sp === "review") {
      return '<p class="note warnt">Sent to the sheet, but I couldn’t confirm it. Look for it there. <button class="link" data-act="untrack" data-id="' + e.id + '">I checked it</button></p>';
    }
    return "";
  }
  function renderRec() {
    var r = sy.rec;
    var find = function (id) { return state.entries.find(function (x) { return x.id === id; }); };
    var miss = r.missing.map(find).filter(Boolean);
    var imps = r.imports || [];
    var h = '<div class="recbox"><p><strong>Checked the sheet.</strong> ' + r.read + " rows read. " + (r.matched + r.byTime) +
      " of your exams are already linked" + (r.byTime ? " (" + r.byTime + " matched by date and time only)" : "") + ".</p>" +
      (r.newTechs && r.newTechs.length ? "<p>Added " + r.newTechs.length + " tech name" + (r.newTechs.length === 1 ? "" : "s") + " from your sheet to your Tech list: " + esc(r.newTechs.join(", ")) + ".</p>" : "");
    if (!miss.length && !imps.length) {
      return h + '<p>Nothing is missing on either side.</p><button class="btn" data-act="dismissrec">Done</button></div>';
    }
    if (miss.length) {
      var chosen = miss.filter(function (e) { return !sy.off[e.id]; }).length;
      h += "<p><strong>" + miss.length + " in the app aren’t in the sheet yet.</strong> Untick any you don’t want sent.</p>";
      miss.forEach(function (e) {
        h += '<label class="recrow"><input type="checkbox" data-rec="' + e.id + '"' + (sy.off[e.id] ? "" : " checked") + "><span>" +
          esc(dateFull(e.date) + "  " + hhmm(e.time) + "  " + partsOf(e).map(partLabel).join(", ")) + "</span></label>";
      });
      h += '<button class="btn solid wide" data-act="sendmissing"' + (chosen ? "" : " disabled") + ">Send " + chosen + " to the sheet</button>";
    }
    if (imps.length) {
      var chosenI = imps.filter(function (e) { return !sy.impOff[e.id]; }).length;
      h += '<p class="gap"><strong>' + imps.length + " in the sheet aren’t in the app yet.</strong> Untick any you don’t want. Times like 130 are read as 13:30, so use Edit if one is wrong.</p>";
      imps.forEach(function (e) {
        h += '<label class="recrow"><input type="checkbox" data-imp="' + e.id + '"' + (sy.impOff[e.id] ? "" : " checked") + "><span>" +
          esc(dateFull(e.date) + "  " + e.sh[1] + "  " + e.sh[3]) + "</span></label>";
      });
      h += '<button class="btn solid wide" data-act="importrows"' + (chosenI ? "" : " disabled") + ">Bring " + chosenI + " into the app</button>";
    }
    return h + '<p class="gap"><button class="link" data-act="dismissrec">Close</button></p></div>';
  }

  function renderSyncCard() {
    var s = state.sync;
    var h = '<section class="sheetbox syncbox"><h2>Google Sheet sync</h2>';
    if (bridgeMode() && !window.claude.__configured()) {
      h += '<p class="hint">This copy of the app runs on its own, so it reaches your Google Sheet through a small script in your own Google account. Paste the two things from your setup.</p>' +
        '<input type="text" id="bridgeUrl" class="linkin" placeholder="Bridge address (https://script.google.com/…)" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(sy.bUrl) + '">' +
        '<input type="password" id="bridgeToken" class="linkin" placeholder="Secret code" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(sy.bTok) + '">' +
        '<button class="btn solid wide" data-act="savebridge"' + (sy.busy ? " disabled" : "") + ">" + (sy.busy ? "Connecting…" : "Save and connect") + "</button>";
    } else if (!s.on) {
      h += '<p class="hint">Log, edit, or delete an exam here and your sheet updates itself. Paste your sheet’s link to connect.</p>' +
        '<input type="text" id="sheetLink" class="linkin" placeholder="Paste the Google Sheets link" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(sy.linkDraft) + '">' +
        '<button class="btn solid wide" data-act="connect"' + (sy.busy ? " disabled" : "") + ">" + (sy.busy ? "Connecting…" : "Connect sheet") + "</button>";
    } else {
      var n = pendingCount(), a = attentionCount();
      var syncLbl = sy.busy ? "Syncing…" : (n ? "Sync now (" + n + ")" : "Up to date");
      h += '<p class="hint"><strong>' + esc(s.title) + "</strong></p>" +
        '<p class="syncline">' + (sy.busy ? "Syncing…" : (n ? n + " waiting to send." : (a ? "Needs attention below." : "Everything is in the sheet."))) + "</p>" +
        '<div class="sheetbtns"><button class="btn solid" data-act="syncnow"' + (sy.busy || !n ? " disabled" : "") + ">" + syncLbl + "</button>" +
        '<button class="btn" data-act="checksheet"' + (sy.busy ? " disabled" : "") + ">Check sheet</button></div>" +
        '<p class="note"><button class="link" data-act="cleansheet"' + (sy.busy ? " disabled" : "") + '>Sort &amp; remove duplicates</button> &nbsp; <button class="link" data-act="disconnect">Disconnect this sheet</button>' +
        (bridgeMode() ? ' &nbsp; <button class="link" data-act="forgetbridge">Change bridge settings</button>' : "") + "</p>";
    }
    if (sy.err) h += '<p class="note warnt" role="alert">' + esc(sy.err) + "</p>";
    if (sy.rec) h += renderRec();
    h += '<p class="note">Cloud backup: ' + (cloud.ready ? (bridgeMode() ? "on. Your log is saved in your own Google account." : "on. Your log is saved to your Claude account.") : (cloud.err ? "couldn’t connect." : "off on this device.")) + "</p>";
    return h + "</section>";
  }

  document.addEventListener("input", function (ev) {
    if (!ev.target) return;
    if (ev.target.id === "sheetLink") sy.linkDraft = ev.target.value;
    else if (ev.target.id === "bridgeUrl") sy.bUrl = ev.target.value;
    else if (ev.target.id === "bridgeToken") sy.bTok = ev.target.value;
    else if (ev.target.id === "histSearch") { histQ = ev.target.value; histLimit = 40; var clr = $("#histClear"); if (clr) clr.hidden = !histQ; var hb = $("#histBody"); if (hb) hb.innerHTML = renderHistoryBody(sortedEntries()); }
  });
  window.addEventListener("online", function () { runSync(); });

  /* ---------- web app extras: home-screen icon and manifest ---------- */
  function drawIcon(size) {
    var c = document.createElement("canvas");
    c.width = c.height = size;
    var x = c.getContext("2d");
    var k = size / 180;
    x.fillStyle = "#0F1A24";
    x.fillRect(0, 0, size, size);
    x.strokeStyle = "#3DD68C";
    x.lineWidth = 18 * k; x.lineCap = "round"; x.lineJoin = "round";
    x.beginPath();
    x.moveTo(50 * k, 94 * k); x.lineTo(79 * k, 123 * k); x.lineTo(132 * k, 57 * k);
    x.stroke();
    return c.toDataURL("image/png");
  }
  function setupApp() {
    var standalone = !!document.querySelector('meta[name="examlog-standalone"]');
    if (standalone) {
      try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js"); } catch (e) { /* offline mode is optional */ }
    }
    if (!standalone) try {
      var small = drawIcon(180), large = drawIcon(512);
      var a = document.createElement("link");
      a.rel = "apple-touch-icon"; a.href = small;
      document.head.appendChild(a);
      var man = {
        name: "Clinical exam log", short_name: "Exam log", display: "standalone",
        background_color: "#EDEFF3", theme_color: "#0F1A24",
        start_url: location.href.split("#")[0],
        icons: [{ src: large, sizes: "512x512", type: "image/png" }]
      };
      var m = document.createElement("link");
      m.rel = "manifest";
      m.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: "application/manifest+json" }));
      document.head.appendChild(m);
    } catch (e) { /* icons are optional */ }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  }

  loadTheme();
  load();
  restoreDraft();
  tick();
  render();
  setupApp();
  setInterval(tick, 15000);
  cloudInit();
  if (state.sync.on && pendingCount()) setTimeout(runSync, 1500);
})();
</script>
</body>
</html>
